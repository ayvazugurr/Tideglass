    <style>
:root {
  color-scheme: dark;
  --bg: #071c26;
  --ink: #edf5ee;
  --muted: #a5bcbb;
  --mint: #c7f2c4;
  --line: #31505a;
  --gold: #efc477;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
}
button,
a {
  -webkit-tap-highlight-color: transparent;
}
button {
  font: inherit;
  cursor: pointer;
  color: inherit;
  border: 0;
  touch-action: manipulation;
}
button:disabled {
  cursor: default;
}
button:focus-visible,
a:focus-visible,
canvas:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 4px;
}
button:active:not(:disabled) {
  transform: translateY(1px);
}
.ambience {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 12% 10%, #366f6d35, transparent 55%),
    radial-gradient(ellipse at 90% 90%, #ae8b4317, transparent 55%),
    linear-gradient(
      120deg,
      transparent 45%,
      #5d988906 45%,
      #5d988906 45.3%,
      transparent 45.3%
    );
}
.shell {
  position: relative;
  width: min(100%, 460px);
  padding: 20px 18px max(16px, env(safe-area-inset-bottom));
  margin: auto;
}
header {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 10;
  padding: 10px 0;
  background: #081d27f5;
  box-shadow: 0 8px 18px #081d2770;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 18px;
}
.brand {
  text-decoration: none;
  color: var(--ink);
  font-weight: 820;
  letter-spacing: 2.8px;
  font-size: 22px;
}
.brand span {
  font-weight: 300;
}
.brand small {
  display: block;
  font-size: 9px;
  letter-spacing: 3px;
  color: var(--muted);
  margin-top: 5px;
}
.top-actions {
  display: flex;
  gap: 8px;
}
.icon {
  background: #17363e;
  border: 1px solid #3a5860;
  border-radius: 15px;
  width: 44px;
  height: 44px;
  font-size: 21px;
}
.sound-test {
  min-height: 48px;
  width: 100%;
  border-radius: 14px;
  background: #1c4c58;
  margin-top: 10px;
  padding: 12px;
}
.stats {
  display: grid;
  grid-template-columns: 1fr 0.8fr 1fr;
  gap: 8px;
  align-items: center;
  padding: 12px 14px;
  border: 1px solid #304d54;
  border-radius: 15px;
  background: linear-gradient(130deg, #1a3b425c, #102b345c);
}
.stats small {
  display: block;
  font-size: 10px;
  letter-spacing: 1.8px;
  color: var(--muted);
}
.stats strong {
  font-size: 29px;
  font-weight: 500;
  letter-spacing: -1px;
  font-variant-numeric: tabular-nums;
  overflow-wrap: anywhere;
}
.stats .stage {
  text-align: center;
}
.stats .stage strong {
  font-size: 23px;
  color: var(--gold);
}
.right {
  text-align: right;
}
.status {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin: 13px 1px 10px;
  font-size: 11px;
  line-height: 1.5;
  color: #b2c9c6;
  min-height: 33px;
  align-items: center;
}
#turn {
  white-space: nowrap;
  letter-spacing: 1px;
  font-size: 9px;
}
#status {
  max-width: 78%;
}
.board-wrap {
  position: relative;
  border: 1px solid #4c747b;
  border-radius: 20px;
  background: linear-gradient(165deg, #0a2632, #123d48);
  padding: 10px 10px 23px;
  box-shadow:
    0 20px 55px #0004,
    inset 0 1px 0 #c2edda18;
}
canvas {
  width: 100%;
  aspect-ratio: 6/8;
  display: block;
  touch-action: none;
  border-radius: 12px;
  outline: none;
  -webkit-touch-callout: none;
}
.sea-label {
  position: absolute;
  bottom: 7px;
  left: 0;
  width: 100%;
  text-align: center;
  font-size: 9px;
  color: #a1c4c4;
  letter-spacing: 2px;
  pointer-events: none;
}
.chain-line {
  min-height: 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  font-size: 11px;
  line-height: 1.5;
  color: var(--muted);
}
.chain-line strong {
  font-size: 10px;
  letter-spacing: 0.3px;
  color: var(--mint);
  text-align: right;
  flex: 0 0 44%;
}
.pulse {
  position: relative;
  overflow: hidden;
  width: 100%;
  height: 52px;
  border: 1px solid #4e7175;
  background: #15343f;
  border-radius: 14px;
  text-align: left;
  padding: 0 16px;
}
.pulse-fill {
  position: absolute;
  inset: 0;
  right: auto;
  background: #365d53;
  transition: width 0.3s;
  width: 0;
}
.pulse-label {
  position: relative;
  display: flex;
  align-items: center;
  font-size: 12px;
  letter-spacing: 1.3px;
  gap: 6px;
}
.pulse small {
  margin-left: auto;
  color: #d2e9d7;
  letter-spacing: 0.4px;
  font-size: 11px;
}
.pulse.ready {
  border-color: var(--mint);
  box-shadow: 0 0 22px #b9ebbe25;
}
.pulse.ready .pulse-fill {
  background: #476f55;
}
.bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 7px;
  gap: 12px;
  font-size: 10px;
  line-height: 1.5;
  color: #b1c9c3;
}
.bottom button {
  background: none;
  padding: 10px 0;
  color: #d0dfd8;
  font-size: 11px;
  min-height: 44px;
  flex-shrink: 0;
}
footer {
  text-align: center;
  margin-top: 8px;
  font-size: 8px;
  letter-spacing: 2px;
  color: #86a8aa;
}
.overlay {
  position: fixed;
  inset: 0;
  background: #061720ed;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  z-index: 5;
}
.overlay.hidden {
  display: none;
}
.panel {
  width: min(100%, 398px);
  max-height: calc(100dvh - 32px);
  overflow-y: auto;
  overscroll-behavior: contain;
  background:
    radial-gradient(ellipse at 0 0, #46756a45, transparent 65%),
    linear-gradient(155deg, #173c45, #0e2833);
  border: 1px solid #53716d;
  border-radius: 26px;
  padding: 26px;
  box-shadow: 0 30px 100px #0007;
  text-align: center;
  scrollbar-width: thin;
}
.eyebrow {
  font-size: 9px;
  line-height: 1.6;
  letter-spacing: 2px;
  color: var(--gold);
  margin: 0 0 13px;
}
.panel h1 {
  font-size: clamp(32px, 8vw, 43px);
  letter-spacing: -1.5px;
  line-height: 1.08;
  font-weight: 350;
  margin: 0 0 12px;
}
.panel h1 b {
  font-weight: 750;
}
.panel h2 {
  font-size: 28px;
  letter-spacing: -0.8px;
  margin: 0 0 12px;
}
.panel p {
  font-size: 13px;
  line-height: 1.65;
  color: #bad0cc;
}
.panel .primary {
  background: linear-gradient(135deg, #dbf7d0, #ace0b8);
  color: #153b35;
  border-radius: 13px;
  font-weight: 750;
  width: 100%;
  padding: 16px 12px;
  font-size: 14px;
  margin-top: 14px;
  box-shadow:
    inset 0 1px 0 #fff6,
    0 6px 20px #001c2533;
}
.secondary {
  border: 1px solid #577078;
  background: #13343b88;
  width: 100%;
  padding: 13px;
  border-radius: 12px;
  margin-top: 10px;
  font-size: 12px;
  min-height: 44px;
}
.hero-gems {
  height: 82px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 17px;
  position: relative;
}
.hero-gems:before {

          x: pos.x,
          y: pos.y,
          vx: Math.cos(j * Math.PI * 2 / 7 + order) * cell * (1 + Math.random()),
          vy: Math.sin(j * Math.PI * 2 / 7 + order) * cell * (1 + Math.random()) - cell,
          life: 0.5 + Math.random() * 0.2,
          color: j % 3 === 0 ? "#edfff5" : color,
          r: cell * (0.025 + Math.random() * 0.035),
          shard: j % 3 !== 0,
          angle: Math.random() * 6,
          spin: (Math.random() - 0.5) * 9,
          delay,
        });
    }
    if (particles.length > 400) particles = particles.slice(-400);
  }
  function commit() {
    if (mode !== "play" || performance.now() < locked) return;
    const previous = game.level;
    const result = game.commit(path, looped);
    path = [];
    looped = false;
    hint = null;
    if (!result) {
      hud();
      return;
    }
    burst(result.removed);
    locked = performance.now() + 290;
    lastInput = performance.now();
    sound(result.loop ? "pulse" : "clear", result.held ? 5 : 0);
    if (result.loop) {
      haptic("loop");
      shake = reducedMotion ? 0 : 8;
      toast("HALKA! +" + result.points);
    } else if (result.flow >= 2)
      toast(
        "AKINTI x" +
          (1 + result.flow * 0.25).toFixed(2) +
          " · +" +
          result.points,
      );
    else if (result.held) { haptic("hold"); toast("AKIŞ! +" + result.points); }
    else if (result.rocks) toast("KAYA KIRILDI +" + result.points);
    else if (game.level !== previous)
      toast(
        game.level === 3
          ? "YENİ RENK"
          : game.level === 4
            ? "KAYALIK SULAR"
            : "BÖLGE " + game.level,
      );
    else toast("+" + result.points);
    if (result.rescued) toast("YENİ AKINTI · +" + result.points);
    if (!missionDone && mission.done(game)) {
      missionDone = true;
      game.award(300);
      sound("pulse", 7);
      toast("HEDEF TAMAM · +300");
    }
    checkpoint();
    hud();
    if (game.over) {
      locked = performance.now() + 700;
      setTimeout(() => {
        if (game.over && mode === "play") end();
      }, 650);
    }
  }
  function pulse() {
    if (mode !== "play" || performance.now() < locked) return;
    const r = game.pulse();
    if (!r) return;
    path = [];
    looped = false;
    pointer = null;
    hint = null;
    burst(r.removed);
    locked = performance.now() + 350;
    shake = reducedMotion ? 0 : 7;
    lastInput = performance.now();
    sound("pulse");
    haptic("pulse");
    toast("DALGAKIRAN!");
    checkpoint();
    hud();
  }
  function indexAt(e) {
    const r = canvas.getBoundingClientRect(),
      x = (e.clientX - r.left) / cell,
      y = (e.clientY - r.top) / cell;
    if (x < 0 || x >= 6 || y < 0 || y >= 8) return -1;
    return Math.floor(y) * 6 + Math.floor(x);
  }
  function add(i) {
    if (mode !== "play" || performance.now() < locked || game.over) return;
    if (i < 0 || !game.board[i] || game.board[i].color < 0) return;
    if (looped) return;
    if (path.length >= 5 && i === path[0] && game.adjacent(path.at(-1), i)) {
      looped = true;
      sound("pulse");
      hud();
      return;
    }
    if (path.length > 1 && i === path[path.length - 2]) {
      path.pop();
      hud();
      return;
    }
    if (path.includes(i)) return;
    if (
      path.length &&
      (!game.adjacent(i, path.at(-1)) ||
        game.board[i].color !== game.board[path[0]].color)
    )
      return;
    path.push(i);
    hint = null;
    lastInput = performance.now();
    sound("note", Math.min(20, path.length * 2));
    hud();
  }
  canvas.addEventListener("pointerdown", (e) => {
    if (
      mode !== "play" ||
      performance.now() < locked ||
      game.over ||
      pointer !== null ||
      e.button > 0
    )
      return;
    e.preventDefault();
    pointer = e.pointerId;
    canvas.setPointerCapture(pointer);
    path = [];
    looped = false;
    lastPointer = { clientX: e.clientX, clientY: e.clientY };
    add(indexAt(e));
  });
  canvas.addEventListener("pointermove", (e) => {
    if (pointer !== e.pointerId) return;
    e.preventDefault();
    const old = lastPointer || e;
    const steps = Math.min(
      120,
      Math.max(
        1,
        Math.ceil(
          Math.hypot(e.clientX - old.clientX, e.clientY - old.clientY) /
            (cell * 0.3),
        ),
      ),
    );
    for (let n = 1; n <= steps; n++)
      add(
        indexAt({
          clientX: old.clientX + ((e.clientX - old.clientX) * n) / steps,
          clientY: old.clientY + ((e.clientY - old.clientY) * n) / steps,
        }),
      );
    lastPointer = { clientX: e.clientX, clientY: e.clientY };
  });
  canvas.addEventListener("pointerup", (e) => {
    if (pointer !== e.pointerId) return;
    pointer = null;
    commit();
  });
  canvas.addEventListener("pointercancel", (e) => {
    if (pointer !== e.pointerId) return;
    pointer = null;
    path = [];
    looped = false;
    hud();
  });
  canvas.addEventListener("lostpointercapture", () => {
    if (pointer !== null) {
      pointer = null;
      path = [];
      looped = false;
      hud();
    }
  });
  canvas.addEventListener("contextmenu", (e) => e.preventDefault());
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      e.preventDefault();
      if (mode === "play") {
        if (path.length) {
          path = [];
          looped = false;
          hud();
        } else pause();
      } else if (mode === "pause") close();
      return;
    }
    if (mode !== "play" || e.repeat || performance.now() < locked || game.over)
      return;
    if (
      [
        "ArrowLeft",
        "ArrowRight",
        "ArrowUp",
        "ArrowDown",
        " ",
        "Enter",
        "e",
        "E",
      ].includes(e.key)
    ) {
      e.preventDefault();
      if (e.key.startsWith("Arrow")) {
        let x = hover % 6,
          y = Math.floor(hover / 6);
        if (e.key === "ArrowLeft") x = Math.max(0, x - 1);
        if (e.key === "ArrowRight") x = Math.min(5, x + 1);
        if (e.key === "ArrowUp") y = Math.max(0, y - 1);
        if (e.key === "ArrowDown") y = Math.min(7, y + 1);
        hover = y * 6 + x;
        canvas.focus({ preventScroll: true });
      }
      if (pointer !== null && [" ", "Enter", "e", "E"].includes(e.key)) return;
      if (e.key === " ") add(hover);
      if (e.key === "Enter") commit();
      if (e.key.toLowerCase() === "e") pulse();
    }
  });
  $("pulse").onclick = pulse;
  $("pause").onclick = pause;
  $("help").onclick = help;
  $("sound").onclick = () => {
    saved.mute = !saved.mute;
    save();
    hud();
    sound("note", 5);
  };
  document.querySelector(".brand").onclick = (e) => {
    e.preventDefault();
    if (mode === "play") pause();
    else if (mode === "menu") menu();
  };
  document.addEventListener("visibilitychange", () => {
    if (document.hidden && mode === "play") pause();
  });
  window.addEventListener("pagehide", () => {
    if (game.over) record();
    else checkpoint();
  });
  function rounded(x, y, w, h, r) {
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
  }
  function symbol(color, x, y, r) {
    ctx.beginPath();
    if (color === 0) {
      ctx.arc(x, y, r, 0, Math.PI * 2);
    } else if (color === 1) {
      ctx.moveTo(x, y - r);
      ctx.lineTo(x + r, y + r * 0.75);
      ctx.lineTo(x - r, y + r * 0.75);
      ctx.closePath();
    } else if (color === 2) {
      ctx.rect(x - r * 0.75, y - r * 0.75, r * 1.5, r * 1.5);
    } else {
      ctx.moveTo(x - r, y);
      ctx.lineTo(x + r, y);
      ctx.moveTo(x, y - r);
      ctx.lineTo(x, y + r);
    }
    ctx.stroke();
  }
  function render(now) {
    requestAnimationFrame(render);
    if (document.hidden || width <= 0 || height <= 0) return;
    if (mode !== "play" && !dirty) return;
    if (now - lastDraw < 1000 / (reducedMotion ? 30 : 60)) return;
    lastDraw = now;
    dirty = false;
    const motionNow = reducedMotion ? 0 : now;
    const dt = Math.min(0.035, (now - animTime) / 1000 || 0.016);
    animTime = now;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, width, height);
    if (shake > 0.1) {
      ctx.translate(
        (Math.random() - 0.5) * shake,
        (Math.random() - 0.5) * shake,
      );
      shake *= 0.85;
    }
    const occupiedRows = game.board
        .map((g, i) => (g ? Math.floor(i / 6) : 9))
        .filter((y) => y < 9),
      waterRow = occupiedRows.length ? Math.min(...occupiedRows) : 8,
      waveY = Math.max(cell * 0.55, waterRow * cell + cell * 0.08);
    const water = ctx.createLinearGradient(0, waveY, 0, height);
    water.addColorStop(0, "#68bac124");
    water.addColorStop(1, "#2c768c48");
    ctx.fillStyle = water;
    ctx.beginPath();
    ctx.moveTo(0, waveY);
    for (let x = 0; x <= width; x += cell / 2)
      ctx.lineTo(
        x,
        waveY +
          Math.sin(motionNow * 0.002 + x * 0.035) * (reducedMotion ? 0 : 3),
      );
    ctx.lineTo(width, height);
    ctx.lineTo(0, height);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = game.board.slice(0, 6).some(Boolean)
      ? "#ffb08a99"
      : "#8ed8d866";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let x = 0; x <= width; x += cell / 3) {
      const y =
        waveY +
        Math.sin(motionNow * 0.002 + x * 0.035) * (reducedMotion ? 0 : 3);
      x ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.stroke();
    for (let y = 0; y < 8; y++)
      for (let x = 0; x < 6; x++) {
        ctx.fillStyle = y === 0 ? "#bb7e5b0b" : "#b7d5d505";
        rounded(x * cell + 3, y * cell + 3, cell - 6, cell - 6, 8);
        ctx.fill();
        ctx.fillStyle = "#769a9f22";
        ctx.beginPath();
        ctx.arc((x + 0.5) * cell, (y + 0.5) * cell, 1.3, 0, 7);
        ctx.fill();
      }
    ctx.strokeStyle = game.board.slice(0, 6).some(Boolean)
      ? "#f4aa87aa"
      : "#92aea733";
    ctx.setLineDash([4, 5]);
    ctx.beginPath();
    ctx.moveTo(4, cell);
    ctx.lineTo(width - 4, cell);
    ctx.stroke();
    ctx.setLineDash([]);
    const live = new Set();
    game.board.forEach((g, i) => {
      if (!g) return;
      live.add(g.id);
      const target = {
        x: ((i % 6) + 0.5) * cell,
        y: (Math.floor(i / 6) + 0.5) * cell,
      };
      let p = positions.get(g.id);
      if (!p) {
        p = { x: target.x, y: target.y + (reducedMotion ? 0 : cell * 0.3) };
        positions.set(g.id, p);
      }
      p.x += (target.x - p.x) * (reducedMotion ? 1 : Math.min(1, dt * 20));
      p.y += (target.y - p.y) * (reducedMotion ? 1 : Math.min(1, dt * 20));
      const selected = path.includes(i),
        loopTarget = looped && g.color === game.board[path[0]]?.color,
        hinted = hint?.includes(i) && path.length === 0;
      const scale = selected
        ? 1.08
        : loopTarget
          ? 1 + Math.sin(motionNow * 0.012) * (reducedMotion ? 0 : 0.065)
          : hinted
            ? 1 + Math.sin(motionNow * 0.005) * (reducedMotion ? 0 : 0.05)
            : 1;
      p.scale ??= 1;
      p.scale += (scale - p.scale) * (reducedMotion ? 1 : 1 - Math.exp(-22 * dt));
      const s = cell * 0.69 * p.scale;
      ctx.save();
      ctx.translate(p.x, p.y);
      if (g.color < 0) {
        // Kaya engeli: kristallerden net biçimde ayrılan çokgen kaya gövdesi.
        const rock = ctx.createLinearGradient(0, -s / 2, 0, s / 2);
        rock.addColorStop(0, "#78939a");
        rock.addColorStop(0.45, "#536f79");
        rock.addColorStop(1, "#304d59");
        ctx.fillStyle = rock;
        rounded(-s / 2, -s / 2, s, s, 8);
        ctx.fill();
        ctx.strokeStyle = "#b6d0d0";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-s * 0.18, -s * 0.28);
        ctx.lineTo(-s * 0.02, -s * 0.08);
        ctx.lineTo(-s * 0.13, s * 0.18);
        ctx.moveTo(s * 0.08, -s * 0.22);
        ctx.lineTo(-s * 0.02, -s * 0.08);
        ctx.lineTo(s * 0.19, s * 0.19);
        ctx.stroke();
        ctx.fillStyle = "#d9eeeeaa";
        ctx.beginPath();
        ctx.arc(-s * 0.22, -s * 0.22, s * 0.045, 0, 7);
        ctx.fill();
      } else {
        const c = themes[saved.theme].colors[g.color];
        ctx.fillStyle = "#00131cb0";
        rounded(-s / 2 - 1, -s / 2 + 8, s + 2, s, 12);
        ctx.fill();
        ctx.fillStyle = c;
        rounded(-s / 2, -s / 2 + 5, s, s, 12);
        ctx.fill();
        ctx.fillStyle = "#002c4270";
        ctx.fill();
        let gr = ctx.createLinearGradient(0, -s / 2, 0, s / 2);
        gr.addColorStop(0, "#edfff8");
        gr.addColorStop(0.16, c);
        gr.addColorStop(0.72, c);
        gr.addColorStop(1, "#28798c");
        ctx.fillStyle = gr;
        rounded(-s / 2, -s / 2, s, s, 12);
        ctx.fill();
        ctx.strokeStyle = selected || loopTarget ? "#f6ffeb" : "#ffffff55";
        ctx.lineWidth = selected || loopTarget ? 2.5 : 1;
        ctx.stroke();
        const gloss = ctx.createLinearGradient(-s / 2, -s / 2, s / 3, s / 3);
        gloss.addColorStop(0, "#ffffff80");
        gloss.addColorStop(0.55, "#ffffff08");
        gloss.addColorStop(1, "#ffffff00");
        ctx.fillStyle = gloss;
        rounded(-s / 2 + 3, -s / 2 + 3, s - 6, s * 0.44, 9);
        ctx.fill();
        ctx.strokeStyle = "#ffffff55";
        ctx.lineWidth = 1;
        rounded(-s / 2 + 3, -s / 2 + 3, s - 6, s - 6, 10);
        ctx.stroke();
        ctx.strokeStyle = "#163e48cc";
        ctx.lineWidth = 2;
        symbol(g.color, 0, 0, s * 0.19);
        if (g.star) {
          ctx.fillStyle = "#fff8d3";
          ctx.font = `bold ${cell * 0.22}px system-ui`;
          ctx.textAlign = "center";
          ctx.fillText("✦", s * 0.28, -s * 0.2);
        }
        if (hinted) {
          ctx.strokeStyle = "#fff9";
          ctx.lineWidth = 1;
          rounded(-s / 2 - 3, -s / 2 - 3, s + 6, s + 6, 14);
          ctx.stroke();
        }
      }
      ctx.restore();
    });
    for (const id of positions.keys()) if (!live.has(id)) positions.delete(id);
    if (path.length) {
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.lineWidth = 5;
      ctx.strokeStyle = "#f3ffdfd9";
      ctx.beginPath();
      path.forEach((i, n) => {
        const p = positions.get(game.board[i]?.id);
        if (p) n ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y);
      });
      if (looped) {
        const p = positions.get(game.board[path[0]]?.id);
        if (p) ctx.lineTo(p.x, p.y);
      }
      ctx.stroke();
      const p = positions.get(game.board[path.at(-1)]?.id);
      if (p) {
        ctx.fillStyle = "#fffde2";
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4, 0, 7);
        ctx.fill();
      }
    }
    particles = particles.filter((p) => p.life > 0);
    for (const p of particles) {
      if (p.delay > 0) { p.delay -= dt; continue; }
      p.life -= dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (!p.ring && !p.crystal) {
        p.vy += cell * 2 * dt;
        p.vx *= Math.exp(-2.5 * dt);
      }
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life * (p.ring ? 3 : 2)));
      ctx.fillStyle = p.color;
      ctx.beginPath();
      if (p.crystal) {
        const progress = Math.max(0, p.life / p.maxLife);
        const size = p.r * (reducedMotion ? 1 : 0.15 + progress * 0.85);
        ctx.globalAlpha = progress;
        rounded(p.x - size, p.y - size, size * 2, size * 2, size * 0.35);
        ctx.fill();
        ctx.strokeStyle = "#f3fff8"; ctx.lineWidth = 2; ctx.stroke();
      } else if (p.ring) {
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 1.5;
        ctx.arc(p.x, p.y, p.r + (1 - p.life / p.maxLife) * cell * 0.42, 0, Math.PI * 2);
        ctx.stroke();
      } else if (p.shard) {
        ctx.save();
        ctx.translate(p.x, p.y);
        p.angle += p.spin * dt;
        ctx.rotate(p.angle);
        ctx.moveTo(0, -p.r * 1.5);
        ctx.lineTo(p.r, 0);
        ctx.lineTo(0, p.r);
        ctx.lineTo(-p.r, 0);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = "#ffffff90"; ctx.lineWidth = 0.65; ctx.stroke();
        ctx.restore();
      } else {
        ctx.arc(p.x, p.y, p.r, 0, 7);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }
  resize();
  hud();
  menu();
  requestAnimationFrame(render);
  // Deliberately expose read-only snapshots for debugging, never mutation hooks.
  window.tideglass = {
    snapshot: () => ({
      mode,
      score: game.score,
      turn: game.turn,
      level: game.level,
      charge: game.charge,
      flow: game.flow,
      bestFlow: game.bestFlow,
      loops: game.loops,
      rocksBroken: game.rocksBroken,
      holds: game.holds,
      mission: mission.text,
      missionDone,
      looped,
      over: game.over,
      board: game.board.map((g) => (g ? { ...g } : null)),
      path: [...path],
      saved: { ...saved },
    }),
  };
})();

</script>
  </body>
</html>
